# Resume as code: edit resume/resume.tex, push, and the PDF on the site updates.
name: resume

on:
  push:
    branches: [main]
    paths: [resume/resume.tex]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Publish PDF to the site
        run: |
          cp resume/resume.pdf src/static/Rohit_Chilhorkar_Resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add src/static/Rohit_Chilhorkar_Resume.pdf
          git diff --cached --quiet || git commit -m "resume: rebuild PDF from resume.tex"
          git push
