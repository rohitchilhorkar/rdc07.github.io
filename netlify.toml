# Netlify reads this file and it overrides the build settings in the UI.
[build]
  command = "python3 scripts/build.py"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/Rohit_Chilhorkar_Resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "attachment; filename=Rohit_Chilhorkar_Resume.pdf"

# Old resume links keep working
[[redirects]]
  from = "/resume"
  to = "/Rohit_Chilhorkar_Resume.pdf"
  status = 301
[[redirects]]
  from = "/data/*"
  to = "/Rohit_Chilhorkar_Resume.pdf"
  status = 301
