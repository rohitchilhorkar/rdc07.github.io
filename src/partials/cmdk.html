<dialog class="cmdk" data-cmdk-dialog aria-label="Command menu">
  <div class="cmdk__box">
    <input class="cmdk__input" type="text" placeholder="Type a command, e.g. resume" aria-label="Search commands" autocomplete="off" spellcheck="false">
    <ul class="cmdk__list" role="listbox" aria-label="Commands"></ul>
    <div class="cmdk__hint"><span>↑ ↓ move</span><span>Enter run</span><span>Esc close</span></div>
  </div>
</dialog>
