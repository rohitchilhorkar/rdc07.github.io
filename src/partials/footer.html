<footer class="foot">
  <div class="wrap">
    <div class="foot__row">
      <span>Rohit Chilhorkar</span>
      <span><span class="k">On call since 2023 · </span>{{year}}</span>
    </div>
    <p class="foot__build">
      <span>static html + css</span><span aria-hidden="true">·</span>
      <span>deployed on Netlify</span><span aria-hidden="true">·</span>
      <span>commit {{commit}}</span><span aria-hidden="true">·</span>
      <span>built {{built}}</span>
      <span class="k" aria-hidden="true">·</span><span class="k">press B for bats</span>
    </p>
  </div>
  <figure class="pune w">
    {{> pune}}
    <figcaption>Pune, India</figcaption>
  </figure>
  <figure class="night k">
    {{> skyline}}
    <div class="ride">{{> car}}</div>
    <figcaption>Somewhere between Gotham and Pune</figcaption>
  </figure>
</footer>
